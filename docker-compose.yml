
services:
  php-apache-environment:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pramnos_php
    ports:
      - "18081:80"
    volumes:
      - .:/var/www/html
    networks:
      # Both: the default one carries db/timescaledb/redis by name, and the fixture
      # network gives this container an address that *looks* public.
      default:
      outbound-fixture:
        ipv4_address: 203.0.113.2
    environment:
      - DB_HOST=timescaledb
      - DB_USER=postgres
      - DB_PASS=secret
      - DB_NAME=pramnos_test
      - DB_TYPE=postgresql
      - CACHE_HOST=redis
    depends_on:
      - db
      - timescaledb
      - redis

  db:
    build:
      context: ./docker/mysql
    image: pramnosframework-mysql:8.0
    container_name: pramnos_db
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=pramnos_test
    ports:
      - "3306"

  timescaledb:
    # Pinned to the oldest TimescaleDB the framework claims to support, not `latest`.
    #
    # `latest` is always at least as new as any real host, so development could not be
    # behind production and therefore could not reproduce it: three framework migrations
    # failed permanently on a production host with `invalid continuous aggregate view`
    # while every run of this suite passed. A continuous aggregate containing
    # `percentile_cont(…)` or `COUNT(DISTINCT …)` is accepted by 2.30.0 and refused by
    # 2.26.4 — and 2.26.4 is the newest package installable on Debian 11 with PostgreSQL
    # 17, because Timescale stopped building for bullseye.
    #
    # pg17 rather than pg14 because 2.26.4 is not built for 14 at all; the registry
    # answers `manifest unknown`. This service keeps no volume, so the major-version
    # change costs nothing — the suite migrates it from empty on every recreate.
    image: timescale/timescaledb:2.26.4-pg17
    container_name: pramnos_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=pramnos_test
    ports:
      - "5432"

  redis:
    image: redis:alpine
    container_name: pramnos_redis
    ports:
      - "6379"

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: pramnos_docs
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    working_dir: /docs

networks:
  default:

  # An address `OutboundUrl` will agree to dial.
  #
  # That class refuses every private, loopback, link-local and reserved address, which is the
  # whole point of it — so nothing reachable from a container is fetchable, and its socket path
  # had no covered line. Not a gap in the tests: a gap in the environment.
  #
  # `203.0.113.0/24` is TEST-NET-3 from RFC 5737, reserved for documentation and routed nowhere
  # on the real internet. PHP's `FILTER_FLAG_NO_PRIV_RANGE | NO_RES_RANGE` does not exclude the
  # documentation blocks, so an address in it reads as public — while a container holding one can
  # still only reach itself.
  #
  # The guard is untouched. Nothing is overridden, no seam is widened, no test subclass relaxes
  # `isPublicAddress()`. The suite simply has somewhere legitimate to fetch from.
  outbound-fixture:
    ipam:
      config:
        - subnet: 203.0.113.0/24
